version: 2
updates:
  # Quartz's own dependencies follow upstream through `npx quartz update`;
  # bumping them here would conflict with every update merge. The limit of 0
  # turns off version updates but keeps Dependabot security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  # The animations app is ours alone.
  - package-ecosystem: npm
    directory: /animations
    schedule:
      interval: weekly
    # Wait 24 h after a release before proposing it.
    cooldown:
      default-days: 1
    # @sveltejs/kit 3 accepts only TypeScript 6 as a peer. Lift this once
    # Kit's peer range includes 7.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    # Majors come in small sets that can be reviewed together: the build
    # toolchain, the formatter, and every other major in a PR of its own.
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major-svelte:
        update-types: [major]
        patterns:
          - "@sveltejs/*"
          - svelte
          - svelte-check
          - vite
          - vitest
      npm-major-lint:
        update-types: [major]
        patterns:
          - prettier
          - "prettier-plugin-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
