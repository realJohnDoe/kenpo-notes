name: Build and Test

on:
  pull_request:
    branches:
      - main
    # labeled/unlabeled/closed drive PR previews (see the preview jobs below)
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Where the build is served. PR builds always use their preview path, so
  # every PR checks that the site works away from /kenpo-notes, whether or
  # not it is deployed.
  BASE_PATH: ${{ github.event_name == 'pull_request' && format('/kenpo-notes/pr-preview/pr-{0}', github.event.number) || '/kenpo-notes' }}

jobs:
  quartz-build:
    # Skip PR events that change nothing to build: closing, and labels other
    # than `preview`.
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Checks out Quartz at the tag pinned in quartz.sh and builds content/ into public/
      - name: Build Quartz
        run: ./quartz.sh

      - name: Sanitize filenames for artifact upload
        run: |
          # Find files with invalid characters for GitHub Actions artifacts and rename them
          find ./public -name "*:*" -type f | while read -r file; do
            # Replace colons with hyphens
            newname=$(echo "$file" | sed 's/:/-/g')
            echo "Renaming: $file -> $newname"
            mv "$file" "$newname"
          done

          # Also handle other invalid characters: ", <, >, |, *, ?
          find ./public -type f | while read -r file; do
            dir=$(dirname "$file")
            filename=$(basename "$file")
            # Replace problematic characters with safe alternatives
            newfilename=$(echo "$filename" | sed 's/[:"<>|*?]/-/g')
            if [ "$filename" != "$newfilename" ]; then
              echo "Sanitizing: $file -> $dir/$newfilename"
              mv "$file" "$dir/$newfilename"
            fi
          done

      - name: Upload Quartz artifact
        uses: actions/upload-artifact@v7
        with:
          name: quartz-build
          path: ./public
          if-no-files-found: error

  animations-build:
    # Skip PR events that change nothing to build: closing, and labels other
    # than `preview`.
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache animations dependencies
        uses: actions/cache@v6
        with:
          path: animations/node_modules
          key: node-animations-${{ hashFiles('animations/package-lock.json') }}
          restore-keys: |
            node-animations-

      - name: Install animations dependencies
        run: |
          cd animations
          npm ci

      - name: Type-check animations
        run: |
          cd animations
          npm run check

      - name: Format-check animations
        run: |
          cd animations
          npm run lint

      - name: Unit-test animations
        run: |
          cd animations
          npm test

      - name: Build animations
        run: |
          cd animations
          npm run build

      - name: Upload animations artifact
        uses: actions/upload-artifact@v7
        with:
          name: animations-build
          path: ./animations/build
          if-no-files-found: error

  # Combines both builds into the site that GitHub Pages serves.
  site:
    needs: [quartz-build, animations-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Quartz artifact
        uses: actions/download-artifact@v8
        with:
          name: quartz-build
          path: ./public

      - name: Download animations artifact
        uses: actions/download-artifact@v8
        with:
          name: animations-build
          path: ./animations-build

      # Copies the animations into the Quartz output without replacing
      # Quartz's home page. .nojekyll stops Pages running Jekyll, which would
      # drop SvelteKit's _app/ directory.
      - name: Combine builds
        run: |
          cp -r animations-build/. public/
          touch public/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./public
          include-hidden-files: true
          if-no-files-found: error

  # Opens the combined site in a browser under the base path it is built for
  # (/kenpo-notes, or the PR's preview path), which no unit test can do.
  # Pinned: Playwright cannot install Chromium deps on ubuntu-latest (26.04).
  e2e:
    needs: site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache animations dependencies
        uses: actions/cache@v6
        with:
          path: animations/node_modules
          key: node-animations-${{ hashFiles('animations/package-lock.json') }}
          restore-keys: |
            node-animations-

      - name: Install animations dependencies
        run: |
          cd animations
          npm ci

      - name: Install Chromium
        run: |
          cd animations
          npx playwright-core install --with-deps chromium

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./public

      - name: Browser-test the site
        run: |
          cd animations
          SITE_DIR=../public npm run test:e2e

  # Publishes main to the root of the gh-pages branch, which Pages serves.
  # Only main deploys there; other branches get a PR preview instead.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: site
    concurrency:
      group: pages-main
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The deploy actions push from a git checkout.
      - uses: actions/checkout@v7

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./public

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./public
          branch: gh-pages
          # Keep the PR previews, and rebase instead of force-pushing so a
          # preview pushed meanwhile isn't lost.
          clean-exclude: pr-preview/
          force: false

  # Publishes a PR labelled `preview` to
  # https://realjohndoe.github.io/kenpo-notes/pr-preview/pr-<n>/ and links it
  # in a PR comment. PRs from forks can't push, so they get none.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    needs: site
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # The deploy actions push from a git checkout.
      - uses: actions/checkout@v7

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./public

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: deploy
          source-dir: ./public
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  # Removes a PR's preview when the PR closes or loses the `preview` label.
  preview-remove:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # The deploy actions push from a git checkout.
      - uses: actions/checkout@v7

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
